name: Bug report
description: A mod that doesn't work on the Mac, a crash, or anything that behaves differently from Windows
labels: ["bug"]
body:
- type: markdown
  attributes:
    value: |
      For things that work on Windows but not on Mac.

      If it also happens on Windows, report it to [Norbyte](https://github.com/Norbyte/bg3se/issues) or the mod's author instead.

- type: textarea
  attributes:
    label: What happened
    description: What you did, what you expected, and what happened.
  validations:
    required: true

- type: input
  attributes:
    label: Mod
    description: Which mod, with a link, if it's about one.

- type: input
  attributes:
    label: bg3mse version
    description: The first line of the log, for example "bg3mse 1.0.0 loaded (commit ...)".
  validations:
    required: true

- type: input
  attributes:
    label: Game version
    description: Shown in the corner of the game's main menu, for example 4.1.1.7631656.
  validations:
    required: true

- type: input
  attributes:
    label: Mac
    description: The model and macOS version, for example "MacBook Pro M3, macOS 15.4".
  validations:
    required: true

- type: textarea
  attributes:
    label: Log files
    description: |
      Drag these in:
      - `~/Library/Application Support/bg3mse/logs/latest.log`
      - after a crash, the newest files in `~/Library/Application Support/bg3mse/Crashes/`

      The log lists your mods and has your user name in file paths.
